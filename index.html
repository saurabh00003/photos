<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen – Free Photo Library</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--card:#f4f4f4;--line:#e4e4e4;--acc:#05a081}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f2f2f2;--mut:#a0a0a0;--card:#1e1e1e;--line:#2c2c2c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.hero{min-height:400px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 5vw;color:#fff;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),linear-gradient(135deg,#0b6e5a,#1d3b8b 60%,#6b2fa0)}
.logo{font-weight:800;font-size:22px;margin-bottom:18px}.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.15;max-width:760px}.hero p{margin:0 0 24px;opacity:.9}
.search{display:flex;width:min(680px,100%);background:#fff;border-radius:14px;overflow:hidden}.search input{flex:1;border:0;padding:16px 18px;font-size:16px;outline:0;color:#1a1a1a;min-width:0}
.search button{border:0;background:var(--acc);color:#fff;padding:0 22px;font-weight:600;cursor:pointer}
.bar{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 5vw;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit}.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{padding:24px 5vw 60px}.meta{color:var(--mut);margin:0 0 16px}
.grid{column-count:4;column-gap:14px}@media(max-width:1100px){.grid{column-count:3}}@media(max-width:760px){.grid{column-count:2;column-gap:8px}}@media(max-width:420px){.grid{column-count:1}}
.item{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:12px;overflow:hidden;background:var(--card);cursor:zoom-in}@media(max-width:760px){.item{margin-bottom:8px}}
.item img{display:block;width:100%;height:auto}
.item .ov{position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.6));opacity:0;transition:.2s;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:13px}.item:hover .ov{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}
.box{background:var(--bg);border-radius:16px;max-width:1100px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 300px}@media(max-width:820px){.box{grid-template-columns:1fr}}
.pic{background:#000;display:flex;align-items:center;justify-content:center;min-height:240px}.pic img{max-width:100%;max-height:78vh;object-fit:contain}
.side{padding:22px;display:flex;flex-direction:column;gap:12px}.side h2{margin:0;font-size:20px}
.tag{display:inline-block;background:var(--card);border-radius:6px;padding:2px 9px;margin:0 4px 4px 0;font-size:13px;color:var(--mut)}
.sz{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);text-decoration:none}.sz:hover{border-color:var(--acc)}.sz small{color:var(--mut)}
.close{position:absolute;top:14px;right:16px;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;z-index:2;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:60px 10px}
</style></head><body>
<section class="hero"><div class="logo">📷 Lumen</div><h1>Free photos, ready to download in every size</h1><p>Browse the collection and grab Original, Large, Medium or Small versions.</p>
<form class="search" id="sf"><input id="q" placeholder="Search photos, tags or categories…" aria-label="Search"><button>Search</button></form></section>
<nav class="bar" id="cats"></nav>
<main><p class="meta" id="meta"></p><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No photos found.</div></main>
<div class="modal" id="lb"><button class="close" id="lbx" aria-label="Close">×</button><div class="box"><div class="pic"><img id="lbimg" alt=""></div>
<div class="side"><h2 id="lbt"></h2><div id="lbm" class="meta"></div><div id="lbtags"></div><strong>Download</strong><div id="lbdl" style="display:grid;gap:8px"></div></div></div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enc=p=>p.split("/").map(encodeURIComponent).join("/");
const W={large:1920,medium:1280,small:640};
let photos=[],cat="All",query="";
function render(){const q=query.toLowerCase();
 const list=photos.filter(p=>(cat==="All"||p.category===cat)&&(!q||[p.title,p.category,...(p.tags||[])].join(" ").toLowerCase().includes(q)));
 $("grid").innerHTML=list.map(p=>`<div class="item" data-i="${photos.indexOf(p)}"><img loading="lazy" src="${enc(p.files.medium)}" width="${p.w}" height="${p.h}" alt="${esc(p.title)}"><div class="ov">${esc(p.title)}</div></div>`).join("");
 $("meta").textContent=list.length+(list.length===1?" photo":" photos");$("empty").hidden=list.length>0;
 const cs=[...new Set(photos.map(p=>p.category).filter(Boolean))].sort();
 $("cats").innerHTML=["All",...cs].map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
$("cats").onclick=e=>{const c=e.target.closest(".chip");if(c){cat=c.dataset.c;render()}};
$("sf").onsubmit=e=>{e.preventDefault();query=$("q").value.trim();render();scrollTo({top:$("cats").offsetTop,behavior:"smooth"})};
$("q").oninput=e=>{query=e.target.value.trim();render()};
$("grid").onclick=e=>{const it=e.target.closest(".item");if(!it)return;const p=photos[+it.dataset.i];
 $("lbimg").src=enc(p.files.large);$("lbimg").alt=p.title;$("lbt").textContent=p.title;$("lbm").textContent=`${p.category||"Uncategorized"} · ${p.w} × ${p.h} px`;
 $("lbtags").innerHTML=(p.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join("");
 $("lbdl").innerHTML=[["original","Original",`${p.w} × ${p.h}`],["large","Large","1920 px"],["medium","Medium","1280 px"],["small","Small","640 px"]]
  .map(([k,n,d])=>`<a class="sz" href="${enc(p.files[k])}" download><span>${n}</span><small>${d}</small></a>`).join("");
 $("lb").classList.add("open")};
$("lbx").onclick=()=>$("lb").classList.remove("open");$("lb").onclick=e=>{if(e.target===$("lb"))$("lb").classList.remove("open")};
addEventListener("keydown",e=>{if(e.key==="Escape")$("lb").classList.remove("open")});
fetch("photos.json").then(r=>r.json()).then(d=>{photos=d;render()}).catch(()=>{$("empty").hidden=false;$("empty").textContent="photos.json not found. Run make_site.py first."});
</script></body></html>
